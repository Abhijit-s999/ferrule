name: Release

# Builds installers for all three platforms. PyInstaller cannot cross-compile,
# so the backend is frozen on each runner natively and then packaged with
# electron-builder alongside it.
#
# Push a tag to cut a release:  git tag v0.3.0 && git push --tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            build: npm run build:linux
            artifacts: "release/*.AppImage\nrelease/*.deb"
          - os: windows-latest
            name: windows
            build: npm run build:win
            artifacts: "release/*.exe"
          - os: macos-latest
            name: macos-arm
            build: npm run build:mac
            artifacts: "release/*.dmg"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Freeze the Python backend
        shell: bash
        run: ./scripts/build-backend.sh

      - name: Install JS dependencies
        run: npm ci

      - name: Build the installer
        shell: bash
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: ferrule-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Download the installer for your platform below.

            - **Windows** — `.exe`, double-click to install
            - **macOS** — `.dmg`, drag to Applications
            - **Linux** — `.AppImage` (chmod +x, run) or `.deb`

            No Python required: the backend is bundled.
            The question bank downloads on first launch.
